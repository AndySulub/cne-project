<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CNE - Demo</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>CNE - Frontend de prueba</h1>
    <section id="status">
      <button id="btn-status">Comprobar /api/status</button>
      <pre id="status-result"></pre>
    </section>

    <section id="login">
      <h2>Login admin</h2>
      <input id="key" placeholder="ADMIN_KEY" />
      <button id="btn-login">Login</button>
      <pre id="login-result"></pre>
    </section>

    <section id="admin-area">
      <h2>Área admin</h2>
      <button id="btn-admin">GET /api/admin</button>
      <pre id="admin-result"></pre>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
